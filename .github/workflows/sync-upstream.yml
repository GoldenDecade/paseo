name: Sync upstream

on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/getpaseo/paseo.git
          git fetch upstream main

          if git merge --ff-only upstream/main; then
            echo "Fast-forward sync succeeded."
          elif git rebase upstream/main; then
            echo "Rebased local commits onto upstream/main."
          else
            echo "::error::Rebase failed with conflicts. Manual intervention required."
            git rebase --abort
            exit 1
          fi

          git push --force-with-lease origin main
